name: Publicar Noticias IA Automáticas

on:
  schedule:
    # Se ejecuta cada 2 días a las 09:00 UTC (10:00 en España)
    - cron: '0 9 */2 * *'
  workflow_dispatch: # Te permite probarlo manualmente con un botón en GitHub

permissions:
  contents: write

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar robot de noticias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/auto_noticias.py

      - name: Subir nuevas noticias al repositorio
        run: |
          git config --local user.email "bot@agentesialab.com"
          git config --local user.name "AgentesIA Bot"
          git add src/content/noticias/
          git diff --quiet && git diff-staged --quiet || (git commit -m "Nuevas noticias automáticas" && git push)